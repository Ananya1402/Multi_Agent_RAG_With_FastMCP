version: "3.9"

services:
  # ── PostgreSQL Database ──
  db:
    image: postgres:16-alpine
    container_name: rag-db
    environment:
      POSTGRES_USER: multi_agent_rag
      POSTGRES_PASSWORD: multi_agent_rag
      POSTGRES_DB: multi_agent_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multi_agent_rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── FastAPI Backend ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override .env values for Docker networking
      - DATABASE_URL=postgresql://multi_agent_rag:multi_agent_rag@db:5432/multi_agent_rag
      - FAQ_CSV_PATH=/data/faqs.csv
      - CHROMA_PERSIST_DIR=/app/chroma_db
    volumes:
      - ./data:/data:ro
      - chroma_data:/app/chroma_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ── Streamlit Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  chroma_data:
